name: Build macOS

on:
  workflow_dispatch:   # Actions 탭에서 수동 실행
  push:
    branches: [mac-support]   # 맥 지원 브랜치 검증용
    tags: ['v*']

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon 러너
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # 서명 없이 arm64 + Intel(x64) 둘 다 빌드
      - run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: PomodoroWidget-mac
          path: |
            dist/*.dmg
            dist/*.zip
